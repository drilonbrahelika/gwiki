# Included in every location: nginx drops inherited add_header lines as soon as a
# location adds its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://themes.googleusercontent.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://themes.googleusercontent.com; img-src 'self' data: https:; frame-src https://drive.google.com https://docs.google.com https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Google's sign-in popup reports back to this window; a stricter policy breaks it.
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
